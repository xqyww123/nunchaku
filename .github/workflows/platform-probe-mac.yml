name: platform-probe-mac

# Measurement probe: macOS build legs (arm64 + Intel) with self-built smbc,
# plus one linux-arm64 musl-static feasibility job.  Not a release workflow.
on:
  push:
    branches:
      - ci/platform-probe-mac
  workflow_dispatch:

jobs:
  macos:
    name: macos ${{ matrix.arch }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            cvc5_asset: cvc5-macOS-arm64-static
            cvc5_sha256: 3840aa53f6ee6fc357415dcfe291d7f5ffec6cfb1ccca6fef64120a0d2be4cb6
          - runner: macos-15-intel
            arch: x86_64
            cvc5_asset: cvc5-macOS-x86_64-static
            cvc5_sha256: 5a7976affaf37dcf03ee44c3d0297c8e0ba08afd44ac832dab97400da726b852
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Runner facts
        run: |
          uname -a
          sw_vers
          sysctl -n machdep.cpu.brand_string || true

      # same OCaml version as the linux release-binary recipe (4.14.2),
      # plain base compiler (musl/static options are linux-only)
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.14.2"
          dune-cache: false

      - name: Build nunchaku
        run: |
          t0=$SECONDS
          opam install -y . --deps-only
          echo "PROBE-TIMING nunchaku-deps $((SECONDS - t0))s"
          t0=$SECONDS
          opam exec -- dune build @install --profile=release
          echo "PROBE-TIMING nunchaku-build $((SECONDS - t0))s"
          cp _build/default/src/main/nunchaku.exe nunchaku-bin
          ./nunchaku-bin --version

      # smbc 0.4.1 cannot build on OCaml 4.14 (its deps sequence>=0.4 and
      # containers 1.x are hard-capped at ocaml<4.08, which predates arm64
      # macOS support entirely).  Nearest buildable: 0.6.1, pinned from the
      # upstream git tag (smbc is not in opam-repository).  containers 2.8.1
      # (from the opam archive repo) is forced because smbc needs the
      # containers.sexp sublibrary that containers 3.x removed.  nunchaku is
      # already built above, so the downgrade cannot hurt it.
      # Full test suite, BEFORE the smbc step: smbc's containers-2.8.1
      # downgrade breaks building the test runner.  Same invocation as the
      # linux CI `run` job (dune runtest --profile=release).
      - name: Run test suite (dune runtest)
        run: |
          set -o pipefail
          t0=$SECONDS
          opam install -y qtest qcheck ounit
          echo "PROBE-TIMING test-deps $((SECONDS - t0))s"
          t0=$SECONDS
          set +e
          opam exec -- dune runtest --profile=release 2>&1 | tee runtest.log
          rc=$?
          set -e
          echo "PROBE-TIMING runtest $((SECONDS - t0))s"
          echo "PROBE-RUNTEST-EXIT $rc"
          echo "PROBE-RUNTEST-SUMMARY $(grep -E 'Ran: [0-9]+ tests' runtest.log || echo 'no Ran: line')"
          exit $rc

      - name: Build smbc 0.6.1
        run: |
          t0=$SECONDS
          opam repo add archive git+https://github.com/ocaml/opam-repository-archive
          opam pin add -y -n smbc.0.6.1 "git+https://github.com/c-cube/smbc.git#v0.6.1"
          opam install -y smbc containers.2.8.1
          cp "$(opam var bin)/smbc" smbc-bin
          echo "PROBE-TIMING smbc-build $((SECONDS - t0))s"
          ./smbc-bin --version

      - name: Fetch cvc5 (pinned release)
        run: |
          curl -sSL -o cvc5.zip "https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.4/${{ matrix.cvc5_asset }}.zip"
          echo "${{ matrix.cvc5_sha256 }}  cvc5.zip" | shasum -a 256 -c
          unzip -q cvc5.zip
          "./${{ matrix.cvc5_asset }}/bin/cvc5" --version | head -1

      - name: CLI smoke
        run: |
          set -o pipefail
          export NUNCHAKU_CVC5="$PWD/${{ matrix.cvc5_asset }}/bin/cvc5"
          export NUNCHAKU_SMBC="$PWD/smbc-bin"
          ./nunchaku-bin --version

          echo "=== gold.nun with --solvers cvc5 ==="
          ./nunchaku-bin --skolems-in-model --no-color --no-specialize \
            --solvers cvc5 --timeout 30 regress/gold.nun | tee smoke-cvc5.out
          grep -q '^SAT' smoke-cvc5.out
          grep -q '{backend:cvc5' smoke-cvc5.out

          echo "=== gold.nun with --solvers smbc ==="
          ./nunchaku-bin --skolems-in-model --no-color --no-specialize \
            --solvers smbc --timeout 30 regress/gold.nun | tee smoke-smbc.out
          grep -q '^SAT' smoke-smbc.out
          grep -q '{backend:smbc' smoke-smbc.out

          echo "=== gold.nun with --solvers cvc5,smbc ==="
          ./nunchaku-bin --skolems-in-model --no-color --no-specialize \
            --solvers cvc5,smbc --timeout 30 regress/gold.nun | tee smoke-both.out
          grep -q '^SAT' smoke-both.out
          grep -q '{backend:' smoke-both.out

      - name: Dynamic-link evidence (otool -L)
        run: |
          echo "=== otool -L nunchaku-bin ==="
          otool -L nunchaku-bin
          echo "=== otool -L smbc-bin ==="
          otool -L smbc-bin
          # only /usr/lib system libraries may appear (first line is the
          # binary's own name)
          test -z "$(otool -L nunchaku-bin | tail -n +2 | grep -v '/usr/lib/')"
          test -z "$(otool -L smbc-bin | tail -n +2 | grep -v '/usr/lib/')"

      - name: Strip (+ re-sign on arm64), prove still runs
        run: |
          echo "=== sizes before strip ==="
          ls -l nunchaku-bin smbc-bin
          strip nunchaku-bin
          strip smbc-bin
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            # strip invalidates the ad-hoc code signature on arm64
            codesign -f -s - nunchaku-bin
            codesign -f -s - smbc-bin
          fi
          echo "=== sizes after strip ==="
          ls -l nunchaku-bin smbc-bin
          ./nunchaku-bin --version
          ./smbc-bin --version
          # and the stripped nunchaku still solves
          export NUNCHAKU_SMBC="$PWD/smbc-bin"
          ./nunchaku-bin --skolems-in-model --no-color --no-specialize \
            --solvers smbc --timeout 30 regress/gold.nun | grep -q '^SAT'

      - uses: actions/upload-artifact@v4
        with:
          name: nunchaku-smbc-macos-${{ matrix.arch }}
          path: |
            nunchaku-bin
            smbc-bin
          retention-days: 30

  linux-arm64-musl:
    name: linux arm64 musl-static feasibility
    timeout-minutes: 90
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Runner facts
        run: |
          uname -a
          gcc --version | head -1

      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      # exact compiler spec of the existing x86_64 release-binary recipe
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.4.14.2+options,ocaml-option-musl,ocaml-option-static
          dune-cache: false

      - name: Build nunchaku (musl static)
        run: |
          t0=$SECONDS
          opam install -y . --deps-only
          echo "PROBE-TIMING nunchaku-deps $((SECONDS - t0))s"
          t0=$SECONDS
          opam exec -- env OCAMLPARAM="_,ccopt=-static" dune build @install --profile=release
          echo "PROBE-TIMING nunchaku-build $((SECONDS - t0))s"
          cp _build/default/src/main/nunchaku.exe nunchaku-bin
          strip nunchaku-bin
          ./nunchaku-bin --version

      - name: Static-ness evidence
        run: |
          file ./nunchaku-bin
          readelf -l ./nunchaku-bin | head -20
          ! readelf -l ./nunchaku-bin | grep -q INTERP

      # Full test suite, BEFORE the smbc step: smbc's containers-2.8.1
      # downgrade breaks building the test runner.  Same invocation as the
      # linux CI musl job: OCAMLPARAM=_,ccopt=-static kept for the test runner too.
      - name: Run test suite (dune runtest)
        run: |
          set -o pipefail
          t0=$SECONDS
          opam install -y qtest qcheck ounit
          echo "PROBE-TIMING test-deps $((SECONDS - t0))s"
          t0=$SECONDS
          set +e
          opam exec -- env OCAMLPARAM="_,ccopt=-static" dune runtest --profile=release 2>&1 | tee runtest.log
          rc=$?
          set -e
          echo "PROBE-TIMING runtest $((SECONDS - t0))s"
          echo "PROBE-RUNTEST-EXIT $rc"
          echo "PROBE-RUNTEST-SUMMARY $(grep -E 'Ran: [0-9]+ tests' runtest.log || echo 'no Ran: line')"
          exit $rc

      - name: Build smbc 0.6.1 (musl static)
        run: |
          t0=$SECONDS
          opam repo add archive git+https://github.com/ocaml/opam-repository-archive
          opam pin add -y -n smbc.0.6.1 "git+https://github.com/c-cube/smbc.git#v0.6.1"
          OCAMLPARAM="_,ccopt=-static" opam install -y smbc containers.2.8.1
          cp "$(opam var bin)/smbc" smbc-bin
          strip smbc-bin
          echo "PROBE-TIMING smbc-build $((SECONDS - t0))s"
          ./smbc-bin --version
          file ./smbc-bin
          readelf -l ./smbc-bin | grep INTERP || echo "smbc-bin: no INTERP (static)"

      - name: Fetch cvc5 (pinned release, sha256 measured 2026-08-24)
        run: |
          curl -sSL -o cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.4/cvc5-Linux-arm64-static.zip
          echo "2a4c108367f20b0c8990abd6b9535a5d62e08908d471d4671c00734e408f85bc  cvc5.zip" | sha256sum -c
          unzip -q cvc5.zip
          ./cvc5-Linux-arm64-static/bin/cvc5 --version | head -1

      - name: CLI smoke
        run: |
          set -o pipefail
          export NUNCHAKU_CVC5=$PWD/cvc5-Linux-arm64-static/bin/cvc5
          export NUNCHAKU_SMBC=$PWD/smbc-bin
          ./nunchaku-bin --version

          echo "=== gold.nun with --solvers cvc5 ==="
          ./nunchaku-bin --skolems-in-model --no-color --no-specialize \
            --solvers cvc5 --timeout 30 regress/gold.nun | tee smoke-cvc5.out
          grep -q '^SAT' smoke-cvc5.out
          grep -q '{backend:cvc5' smoke-cvc5.out

          echo "=== gold.nun with --solvers smbc ==="
          ./nunchaku-bin --skolems-in-model --no-color --no-specialize \
            --solvers smbc --timeout 30 regress/gold.nun | tee smoke-smbc.out
          grep -q '^SAT' smoke-smbc.out
          grep -q '{backend:smbc' smoke-smbc.out

          echo "=== gold.nun with --solvers cvc5,smbc ==="
          ./nunchaku-bin --skolems-in-model --no-color --no-specialize \
            --solvers cvc5,smbc --timeout 30 regress/gold.nun | tee smoke-both.out
          grep -q '^SAT' smoke-both.out
          grep -q '{backend:' smoke-both.out

      - uses: actions/upload-artifact@v4
        with:
          name: nunchaku-smbc-linux-arm64-musl
          path: |
            nunchaku-bin
            smbc-bin
          retention-days: 30

name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  # Manual dispatch, so the release path can be REHEARSED on the fixed tree
  # before a tag exists: the five build legs, their smokes, and the whole
  # twenty-five-asset contract check in release-assets' collect step, which is
  # deliberately not tag-gated.
  #
  # What a dispatch CANNOT reach is `release-attach.sh publish`: it asserts
  # that the tag equals the VERSION file before its first gh call, so a
  # throwaway pre-release tag dies there having done nothing.  Its first
  # execution is therefore the real tag push.  That is a stated limit, not an
  # oversight -- RELEASE_CHECKLIST.md section 9 step 1 in isabelle-packaging-ci
  # lists exactly which gh calls it covers and which it does not, and step 3
  # says what to do when one of them fails.
  workflow_dispatch:

concurrency:
  # What this group buys is ONE RUN PER REF, and nothing more.  It does not
  # protect the release: `gh release create`/`upload` now run in a single
  # tag-gated job (see release-assets below), and two runs that could both reach
  # it would have to share a ref, i.e. be the same tag pushed twice -- which
  # means deleting and re-pushing the tag, the thing RELEASE_CHECKLIST.md
  # forbids.  Nor does it protect the caches: a duplicate actions/cache save is
  # a warning, not a failure.
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel only pull-request runs.  Every other event either costs a 300-minute
  # win-64 leg that somebody is waiting on (the workflow_dispatch rehearsal,
  # which shares this group with any push to main and was being cancelled by
  # one) or must never be interrupted at all (a tag push).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The default for every job: only release-assets widens it, and its own
# `permissions:` block says why.  Without this the repository default applies,
# which on a public repository is read but on a private one can be write --
# `run` and `benchmark` have no business holding either.
permissions:
  contents: read

jobs:
  run:
    name: build  # build+test on various versions of OCaml, on linux
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        ocaml-compiler:
          - 4.14.x
          - 5.0.x
          - 5.4.x

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true

      - run: opam install -t . --deps-only
      - run: opam exec -- dune build @install --profile=release
      - run: opam exec -- dune runtest --profile=release

  # ---------------------------------------------------------------------------
  # Release binaries.  Five platforms, two binaries each -- the nunchaku binary
  # and the smbc the component bundles from 0.5.3 on -- so TEN BINARIES, TEN
  # .sha256 SIDECARS and FIVE versions-<platform>.txt records: twenty-five
  # release assets.  The naming contract and the reasoning behind it live in
  # .github/scripts/release-attach.sh.  These two job families do NOT touch the
  # GitHub release: each leg uploads its five files as a run artifact, and the
  # release-assets job below assembles, asserts and publishes all twenty-five in
  # one place (release-attach.sh's header explains why that is not five places).
  #
  # WHICH SOLVERS, WHICH BYTES: component/solvers.pins, read by every script
  # here and by isabelle-packaging-ci's recipe.  Nothing in this file restates a
  # solver version, asset name or digest.
  #
  #   conda subdir    Isabelle platform   runner            toolchain
  #   linux-64        x86_64-linux        ubuntu-latest     musl-static
  #   linux-aarch64   arm64-linux         ubuntu-24.04-arm  musl-static
  #   osx-64          x86_64-darwin       macos-15-intel    plain 4.14.2
  #   osx-arm64       arm64-darwin        macos-15          plain 4.14.2 + re-sign
  #   win-64          x86_64-cygwin       windows-latest    Isabelle's Cygwin + opam
  #
  # (Isabelle platform identifiers as in the distribution's
  # lib/scripts/isabelle-platform.  macos-15-intel, not macos-13: the macos-13
  # label is retired and those legs queue forever without ever being scheduled.)
  #
  # BASH 3.2 ON THE TWO macOS LEGS.  Apple's /bin/bash is 3.2, so every script
  # these legs run -- release-build-unix.sh, release-verify-link.sh,
  # release-fetch-cvc5.sh, release-smoke.sh and the solver-pins.sh they source
  # -- must avoid `mapfile`/`readarray`, `declare -A` and `${x,,}`/`${x^^}`.
  # `mapfile` in particular does not merely error there: the array stays empty
  # and the loop over it does nothing, so a step whose whole job is to enumerate
  # files goes green having enumerated none.  `grep -rnE
  # 'mapfile|readarray|declare -A|\$\{[A-Za-z_]+(,,|\^\^)\}'` over .github/
  # must stay empty apart from this paragraph.
  #
  # WHY TWO JOBS rather than one five-way matrix.  The four unix legs share
  # every step and differ only in matrix fields, so they are one matrix.  win-64
  # is a different toolchain end to end -- Isabelle's bundled Cygwin brought up
  # from PowerShell, its own opam, its own cache -- and it needs a 300-minute
  # budget where the unix legs need 90.  Folding it in would force that budget
  # on every leg, which destroys the only thing a timeout is for, and would show
  # each leg a dozen skipped steps belonging to the other family.  Both jobs end
  # at the same contract.
  # ---------------------------------------------------------------------------
  release-binary:
    name: "release ${{ matrix.target.isa_platform }} (nunchaku + smbc) + CLI smoke"
    needs: run   # never publish a binary from a tree whose test matrix is red
    # Every push to main, and every manual dispatch, but not pull requests: a PR
    # is already gated by `run` (the three-compiler build+test matrix), which is
    # the actual correctness gate, and making every PR wait on a leg budgeted at
    # 300 minutes is real cost.  Running on pushes to main is what makes "by tag
    # time the build has already been proven" true, so that stays.
    if: github.event_name != 'pull_request'
    timeout-minutes: 90
    runs-on: ${{ matrix.target.runner }}
    permissions:
      # read only: this family no longer writes to the GitHub release.  Only
      # release-assets does, and only on a tag.
      contents: read
    strategy:
      # One platform's failure must not hide the others': with fail-fast a
      # single red leg would leave the remaining four unmeasured, and the
      # packaging side would then see a partial release with no way to tell
      # "not built" from "built and broken".
      fail-fast: false
      matrix:
        # An object-valued key, NOT `include:`.  `include` entries whose keys
        # are absent from the base matrix are merged into every combination in
        # turn, each overwriting the last, so a list of platforms collapses onto
        # the last one (measured in isabelle-packaging-ci's release-rocksdict,
        # where three legs all came out win-64).
        #
        # No cvc5 asset or digest here.  They used to sit in these rows, next to
        # the platform id but not bound to it, and duplicated again in the
        # win-64 job and a third time in the packaging recipe -- ten literals in
        # two repositories with nothing comparing them.  They now live in
        # component/solvers.pins, keyed on the platform, and every consumer
        # looks them up there.
        target:
          - isa_platform: x86_64-linux
            runner: ubuntu-latest
            musl: true
            ocaml: ocaml-variants.4.14.2+options,ocaml-option-musl,ocaml-option-static
          - isa_platform: arm64-linux
            runner: ubuntu-24.04-arm
            musl: true
            ocaml: ocaml-variants.4.14.2+options,ocaml-option-musl,ocaml-option-static
          - isa_platform: x86_64-darwin
            runner: macos-15-intel
            musl: false
            ocaml: "4.14.2"
          - isa_platform: arm64-darwin
            runner: macos-15
            musl: false
            ocaml: "4.14.2"
    env:
      ISA_PLATFORM: ${{ matrix.target.isa_platform }}
    steps:
      - uses: actions/checkout@v4

      # musl is a linux-only story: the macOS legs have no equivalent and want
      # none (see release-build-unix.sh).
      - if: matrix.target.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.target.ocaml }}
          # no dune cache here: a release binary must never be able to come
          # out of a cache shared with the glibc build-matrix jobs
          dune-cache: false

      - name: Install build and test dependencies
        run: |
          # NOTHING to undo from a warm cache here.  setup-ocaml@v3 snapshots
          # ~/.opam INSIDE its own step -- installer.ts:69-90, saveOpamCache()
          # immediately after installOcaml(), inside `if (!opamCacheHit)`, and
          # its post step saves only the dune cache -- so a restored root is a
          # bare compiler switch and can never carry this job's own pins.  (The
          # win-64 leg is different: it saves its root with an explicit
          # actions/cache/save AFTER the smbc step, which is why
          # .github/scripts/w2-deps.sh really does need its `pin remove`.)
          #
          # -t installs the test dependencies too: release-build-unix.sh runs
          # `dune runtest` on this platform's own toolchain.
          opam install -t . --deps-only

      - name: Build nunchaku + smbc (version from VERSION, tested, stripped)
        run: opam exec -- .github/scripts/release-build-unix.sh

      - name: Link-footprint and architecture evidence
        run: .github/scripts/release-verify-link.sh "$ISA_PLATFORM" nunchaku-bin smbc-bin

      - name: Fetch cvc5 (pinned in component/solvers.pins)
        run: .github/scripts/release-fetch-cvc5.sh

      # cvc5 too: it is a release ingredient like the other two, and the asset
      # it comes from is chosen by platform id.  This is the check that would
      # notice a pins edit pairing an x86_64 asset with an arm64 leg.
      - name: cvc5 architecture evidence
        run: .github/scripts/release-verify-link.sh "$ISA_PLATFORM" cvc5-bin

      - name: CLI smoke (the assembled component, not the bare binary)
        env:
          SRC_ROOT: ${{ github.workspace }}
          NUNCHAKU_SRC: ${{ github.workspace }}/nunchaku-bin
          SMBC_SRC: ${{ github.workspace }}/smbc-bin
          CVC5_SRC: ${{ github.workspace }}/cvc5-bin
        run: .github/scripts/release-smoke.sh

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: nunchaku-${{ matrix.target.isa_platform }}
          path: |
            nunchaku-bin
            nunchaku-bin.sha256
            smbc-bin
            smbc-bin.sha256
            versions-${{ matrix.target.isa_platform }}.txt
          # A leg that produced no files must fail HERE.  Left at the default
          # `warn` the leg goes green, and the absence surfaces in collect
          # after every other leg has run -- up to 300 minutes later.
          if-no-files-found: error
          retention-days: 90
          # Artifacts are scoped to the RUN, and "Re-run all jobs" reuses the
          # run -- without this, the legs that had passed fail at this step on
          # the second pass ("an artifact for the given name already exists").
          overwrite: true

  release-binary-win:
    name: "release x86_64-cygwin (nunchaku + smbc) + CLI smoke"
    needs: run
    if: github.event_name != 'pull_request'   # see release-binary above
    # 300 minutes, not 90: this leg installs a full Isabelle distribution,
    # initialises its Cygwin, builds an OCaml switch from scratch on a cold
    # cache, and then builds nunchaku, its test suite and smbc under it.
    timeout-minutes: 300
    runs-on: windows-latest
    permissions:
      contents: read   # see release-binary above
    env:
      ISA_PLATFORM: x86_64-cygwin
    steps:
      - uses: actions/checkout@v4

      - name: Disk space and layout decision
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table Name,@{n='Used(GB)';e={[math]::Round($_.Used/1GB,1)}},@{n='Free(GB)';e={[math]::Round($_.Free/1GB,1)}}
          $cFree = (Get-PSDrive C).Free/1GB
          $root = if ($cFree -gt 25) { 'C:\isa' } else { "$env:GITHUB_WORKSPACE\..\isa" }
          $root = [System.IO.Path]::GetFullPath($root)
          echo "ISA_ROOT=$root" >> $env:GITHUB_ENV
          echo "ISA_HOME_W=$root\Isabelle2025-2" >> $env:GITHUB_ENV
          echo "BASH_EXE=$root\Isabelle2025-2\contrib\cygwin\bin\bash.exe" >> $env:GITHUB_ENV
          echo "chosen root: $root (C free: $([math]::Round($cFree,1)) GB)"
          # The opam cache key must be the dependency set AS CHECKED OUT.
          # w2-build.sh rewrites nunchaku.opam's version field between the
          # restore and the save, so `hashFiles('nunchaku.opam')` -- which the
          # runner evaluates at each step -- produced two DIFFERENT keys: the
          # exact-key hit was never true, the save key was constant, so run #1
          # won the key permanently and every later restore came back through
          # the loose prefix with run #1's opam root, forever.  Capture the
          # pristine hash here, before any script touches the file, and use it
          # for both.  The v5 salt abandons whatever the v4 key already froze.
          $h = (Get-FileHash "$env:GITHUB_WORKSPACE\nunchaku.opam" -Algorithm SHA256).Hash.ToLower()
          echo "OPAM_CACHE_KEY=w2-opam-v5-$h" >> $env:GITHUB_ENV
          echo "opam cache key: w2-opam-v5-$h"

      # The solver pins, read ONCE from component/solvers.pins by the same
      # parser every other leg uses, and handed to the PowerShell steps below.
      # This leg's cvc5 fetch stays in PowerShell (native Windows binary, no
      # Cygwin needed, and rewriting it would restructure the one leg nobody can
      # test locally) -- but it no longer carries its own copy of the pins.
      # Git-for-Windows bash is on windows-latest from the first step; this leg
      # already uses `shell: bash` for two other steps.
      - name: Read the solver pins
        shell: bash
        run: |
          set -euo pipefail
          . .github/scripts/solver-pins.sh
          # ASSIGN, then use.  `read -r a b <<< "$(pin ...)"` takes read's exit
          # status and `echo "X=$(pin ...)"` takes echo's, so `set -e` never
          # sees pin's failure: measured 2026-08-25, this step written that way
          # exited 0 after writing `CVC5_VERSION=` into $GITHUB_ENV, and the leg
          # then died ~250 minutes later on a cvc5 URL 404 whose diagnosis named
          # cvc5 rather than the pins edit that caused it.
          version=$(pin cvc5-version)
          row=$(pin cvc5 x86_64-cygwin)
          read -r asset sha <<< "$row"
          {
            echo "CVC5_VERSION=$version"
            echo "CVC5_ASSET=$asset"
            echo "CVC5_SHA256=$sha"
          } >> "$GITHUB_ENV"
          echo "cvc5 $version / $asset / $sha"

      - name: Restore cached Isabelle installer
        id: isaexe
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\isadl\Isabelle2025-2.exe
          key: isabelle2025-2-exe-v1

      - name: Download Isabelle2025-2 (Windows)
        if: steps.isaexe.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\isadl" | Out-Null
          # isabelle.in.tum.de redirects to plain-HTTP dist.isabelle.cit.tum.de:80,
          # which the runner cannot reach (measured) -- use the HTTPS target directly.
          # -f: WITHOUT it an HTTP error page is written to the file and curl
          # still exits 0, the step goes green, the bad file is cached under a
          # fixed key, and every later run restores it and dies in `7z x` --
          # permanently red, unfixable from inside the repository.  With -f,
          # --retry also covers 5xx.
          curl.exe -fsSL --retry 3 -o "$env:RUNNER_TEMP\isadl\Isabelle2025-2.exe" 'https://dist.isabelle.cit.tum.de/dist/Isabelle2025-2.exe?token=Isabelle'
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Asserted after the download AND after a restore, because a poisoned
      # cache entry is exactly the case the download step never sees.
      # Content-Length measured 2026-08-25:
      #   HEAD https://dist.isabelle.cit.tum.de/dist/Isabelle2025-2.exe?token=Isabelle
      #   -> Content-Length: 1069837790, Last-Modified: Sun, 18 Jan 2026
      # -- a frozen release file, so an exact size is right and loud.  It is the
      # one download in this pipeline with no digest; replace this with a pinned
      # sha256 once a run records one.  The size alone already makes a poisoned
      # cache impossible, which is the point.
      - name: Assert the installer is the pinned one
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\isadl\Isabelle2025-2.exe"
          $len = (Get-Item $exe).Length
          Write-Host "installer length: $len"
          if ($len -ne 1069837790) {
            Write-Error "Isabelle2025-2.exe is $len bytes, expected 1069837790 -- truncated download or a poisoned cache entry"
            exit 1
          }

      - name: Save Isabelle installer to cache
        # success(), not always(): cache what we just successfully fetched and
        # asserted, never what a failed run left behind.
        if: steps.isaexe.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\isadl\Isabelle2025-2.exe
          key: isabelle2025-2-exe-v1

      - name: Extract Isabelle (7z)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:ISA_ROOT | Out-Null
          7z x -y "-o$env:ISA_ROOT" "$env:RUNNER_TEMP\isadl\Isabelle2025-2.exe" | Select-Object -Last 5
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem $env:ISA_HOME_W | Select-Object Name | Format-Table

      - name: Cygwin init (symlinks + rebaseall + postinstall)
        shell: pwsh
        run: |
          # replica of Environment.cygwin_init; the official "-init" launcher
          # detaches (launch4j GUI wrapper, exit 259) so it cannot be awaited.
          python "$env:GITHUB_WORKSPACE\.github\scripts\w2-cygwin-init.py"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # sanity: bash, symlinks, basic tools.  `set -e` FIRST: the status of a
          # `;`-list is the LAST command's, so without it the whole check is
          # `echo`'s exit status and cannot fail (measured:
          # `bash -c 'false; ls /nonexistent; echo OK'` exits 0).  That matters
          # because w2-cygwin-init.py no-ops -- still printing "cygwin init
          # done", still exiting 0 -- whenever the `isabelle/uninitialized`
          # marker is absent.
          & $env:BASH_EXE --login -c 'set -e; uname -a; ls -l /usr/bin/awk; echo CYGWIN_OK'
          exit $LASTEXITCODE

      - name: POSIX path bookkeeping
        shell: pwsh
        run: |
          $ws = (& $env:BASH_EXE --login -c "cygpath -u '$env:GITHUB_WORKSPACE'" | Select-Object -Last 1)
          echo "WS_POSIX=$ws" >> $env:GITHUB_ENV
          echo "workspace posix path: $ws"

      - name: Install extra Cygwin packages (opam + build tools)
        shell: pwsh
        run: |
          $mirror = (Get-Content "$env:ISA_HOME_W\contrib\cygwin\isabelle\cygwin_mirror" -Raw).Trim()
          New-Item -ItemType Directory -Force C:\temp\cygpkg | Out-Null
          # no pwsh function here: a function's pipeline output would be
          # captured into its return value (measured)
          $ok = $false
          foreach ($site in @($mirror, 'https://mirrors.kernel.org/sourceware/cygwin/')) {
            Write-Host "===== cygwin setup from $site ====="
            # `git` is in the list for w2-smbc.sh, which clones smbc's upstream
            # tag and then asserts HEAD against the commit
            # component/solvers.pins names -- the same commit the four unix legs
            # hand to opam, so all five legs ship the same solver bytes from one
            # source of truth.
            $pkgargs = @('--site', $site, '--no-verify',
                         '--local-package-dir', 'C:\temp\cygpkg',
                         '--root', "$env:ISA_HOME_W\contrib\cygwin",
                         '--packages', 'opam,gcc-core,make,m4,patch,unzip,diffutils,flexdll,bzip2,rsync,git',
                         '--no-shortcuts', '--no-startmenu', '--no-desktop', '--quiet-mode')
            $p = Start-Process -FilePath "$env:ISA_HOME_W\contrib\cygwin\isabelle\cygwin.exe" -ArgumentList $pkgargs -PassThru
            if (-not $p.WaitForExit(1500000)) { $p.Kill(); Write-Error 'cygwin setup timed out'; exit 1 }
            Write-Host "setup exit code: $($p.ExitCode)"
            # setup is a GUI-subsystem exe: its console output is invisible,
            # the real diagnostics are in its logs
            foreach ($log in 'setup.log','setup.log.full') {
              $f = "$env:ISA_HOME_W\contrib\cygwin\var\log\$log"
              if (Test-Path $f) { Write-Host "===== $log (tail) ====="; Get-Content $f -Tail 80 | Out-Host }
            }
            if (($p.ExitCode -eq 0) -and (Test-Path "$env:ISA_HOME_W\contrib\cygwin\bin\opam.exe")) { $ok = $true; break }
            Write-Host "setup from $site failed or opam still missing"
          }
          if (-not $ok) { Write-Error 'cygwin package installation failed on all mirrors'; exit 1 }
          # sanity must name /usr/bin paths: the runner's Windows PATH (mingw
          # gcc, Strawberry patch, Git unzip, Git git) leaks into cygwin shells
          # and can satisfy a bare "command -v" spuriously (measured)
          # install, tr, od, file and cygcheck come from the shared and the
          # win-64-only scripts this leg runs: release-smoke.sh stages the
          # component with `install -m 755` and normalises stderr with `tr`;
          # release-verify-link.sh's *-cygwin branch calls `cygcheck` and reads
          # the PE header with `od` (it never calls `file` -- that is only in
          # the *-linux branch, which this leg does not reach); `file` is used
          # by w2-build.sh and w2-smbc.sh, both of which run under `set -e`.
          # Listing them here turns a missing tool into a one-line diagnosis at
          # minute five instead of a confusing failure at minute two hundred
          # and fifty.
          & $env:BASH_EXE --login -c 'set -e; for t in opam gcc make m4 patch unzip git strip install tr od file cygcheck sha256sum; do test -x /usr/bin/$t || { echo "MISSING /usr/bin/$t"; exit 1; }; done; /usr/bin/opam --version; /usr/bin/gcc --version | head -1; /usr/bin/git --version'
          exit $LASTEXITCODE

      - name: Restore opam root cache
        id: opamroot
        uses: actions/cache/restore@v4
        with:
          path: ~\.opam
          key: ${{ env.OPAM_CACHE_KEY }}
          # v5-scoped, NOT the bare `w2-opam-` prefix: with the loose prefix the
          # stale v4 entry is restored anyway and the salt bump buys nothing.
          restore-keys: |
            w2-opam-v5-

      - name: ocaml_setup_base (opam init + OCaml 4.14.1 switch)
        shell: pwsh
        run: |
          & $env:BASH_EXE --login "$env:WS_POSIX/.github/scripts/w2-ocaml-setup.sh"
          exit $LASTEXITCODE

      - name: Install nunchaku opam dependencies
        shell: pwsh
        run: |
          & $env:BASH_EXE --login "$env:WS_POSIX/.github/scripts/w2-deps.sh"
          exit $LASTEXITCODE

      - name: Build nunchaku (dune, release)
        shell: pwsh
        run: |
          & $env:BASH_EXE --login "$env:WS_POSIX/.github/scripts/w2-build.sh"
          exit $LASTEXITCODE

      # The gate, on this platform's toolchain.  Deliberately NOT
      # continue-on-error, unlike the platform probe this leg grew out of: the
      # three hermetic suites 0.5.3 added fork, setsid, put children in their
      # own process group and kill(-pid) them, Cygwin only emulates all of that,
      # and shipping a win-64 binary whose test suite was never required to pass
      # would be certifying nothing.  MUST precede the smbc step below.
      - name: Full test suite (dune runtest)
        shell: pwsh
        run: |
          & $env:BASH_EXE --login "$env:WS_POSIX/.github/scripts/w2-runtest.sh"
          exit $LASTEXITCODE

      - name: Build smbc (pinned commit, from the upstream git tag)
        shell: pwsh
        run: |
          & $env:BASH_EXE --login "$env:WS_POSIX/.github/scripts/w2-smbc.sh"
          exit $LASTEXITCODE

      - name: Save opam root cache
        # success(), not always(): a run that died inside w2-smbc.sh must not
        # leave a half-configured switch in the cache, and with the key now
        # stable (see OPAM_CACHE_KEY above) the first write to a key wins
        # permanently.
        if: steps.opamroot.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~\.opam
          key: ${{ env.OPAM_CACHE_KEY }}

      - name: Fetch cvc5 (pinned in component/solvers.pins)
        shell: pwsh
        run: |
          # Asset, digest and version all come from the pins, exported by the
          # "Read the solver pins" step above -- this leg no longer carries its
          # own copy of any of the three.
          curl.exe -fsSL --retry 3 -o cvc5.zip "https://github.com/cvc5/cvc5/releases/download/cvc5-$env:CVC5_VERSION/$env:CVC5_ASSET.zip"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $h = (Get-FileHash cvc5.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:CVC5_SHA256) {
            Write-Error "cvc5.zip sha256 is $h, expected $env:CVC5_SHA256"; exit 1 }
          Expand-Archive -Force cvc5.zip -DestinationPath cvc5dist
          New-Item -ItemType Directory -Force solvers | Out-Null
          Copy-Item "cvc5dist\$env:CVC5_ASSET\bin\cvc5.exe" solvers\cvc5.exe
          # the pinned cvc5 version, asserted rather than assumed -- cvc5 is a
          # native Windows binary, so it runs here without Cygwin.  A literal
          # substring test, not a regex: `-match 'cvc5 1\.3\.4'` needs the dots
          # escaped by hand every time the pin moves, and the unescaped form
          # matches `cvc5 1x3y4`.  Measured first line:
          # "cvc5 1.3.4 [git f3b21c4 on branch HEAD]", so the trailing space is
          # always there.
          $v = (& .\solvers\cvc5.exe --version | Select-Object -First 1)
          Write-Host "cvc5: $v"
          if (-not $v.Contains("cvc5 $env:CVC5_VERSION ")) {
            Write-Error "expected cvc5 $env:CVC5_VERSION, got: $v"; exit 1 }

      - name: CLI smoke (the assembled component, under Isabelle's Cygwin)
        shell: pwsh
        run: |
          & $env:BASH_EXE --login "$env:WS_POSIX/.github/scripts/w2-smoke.sh"
          exit $LASTEXITCODE

      - name: Stage the binaries under the names every leg uses
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/nunchaku.exe nunchaku-bin
          cp artifacts/smbc.exe smbc-bin

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: nunchaku-${{ env.ISA_PLATFORM }}
          path: |
            nunchaku-bin
            nunchaku-bin.sha256
            smbc-bin
            smbc-bin.sha256
            versions-${{ env.ISA_PLATFORM }}.txt
          # See the unix leg: a leg that uploaded nothing fails here, not in
          # collect.
          if-no-files-found: error
          retention-days: 90
          overwrite: true   # see the unix leg's upload

  # ---------------------------------------------------------------------------
  # The release assets.  The five build legs upload their five files as run
  # artifacts and touch nothing else; this job turns those artifacts into the
  # twenty-five contracted release assets, asserts that it got exactly them, and
  # -- on a tag push only -- creates the release, uploads, re-asserts and takes
  # it out of draft.  The asset contract, and why creation lives here rather
  # than in five racing legs, are in .github/scripts/release-attach.sh.
  #
  # THE COLLECT STEP IS NOT TAG-GATED, deliberately.  It is pure local logic --
  # five artifacts in, twenty-five named files out -- so a workflow_dispatch
  # rehearsal executes the whole contract, including "all five legs arrived",
  # before any tag exists.  Only `publish` needs a tag and a release object, and
  # only `publish` is gated.  RELEASE_CHECKLIST.md section 9 step 1 records
  # exactly what a rehearsal therefore still cannot reach.
  #
  # Ordering note for whoever dispatches the packaging repository: a DRAFT
  # release is not served at https://github.com/.../releases/download/<tag>/...,
  # which is exactly the URL isabelle-packaging-ci's release-nunchaku.yml
  # fetches.  So the un-draft at the end of `publish` is load-bearing: packaging
  # must not be dispatched until this job is green.  Written down in
  # RELEASE_CHECKLIST.md section 9 as well, which is where the dispatcher will
  # actually be looking.
  # ---------------------------------------------------------------------------
  release-assets:
    name: "release assets (all five platforms, then publish)"
    needs: [release-binary, release-binary-win]
    # No tag guard: see above.  `needs:` alone already keeps this job away from
    # pull requests, where both build families are skipped.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the only job in this workflow that writes a release
      # Read-only, and here BEFORE it is needed: recovery from a red
      # release-assets is "re-run failed jobs", which re-runs this job alone in
      # a new attempt while the build legs' artifacts belong to the previous
      # one.  Reaching across attempts needs `actions: read` and a token, and a
      # tag re-run uses the workflow file from the tagged commit -- so adding
      # them during the incident is not possible without moving the tag.
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          # One directory per leg, named nunchaku-<isabelle-platform> by the two
          # upload steps above.  release-attach.sh looks for exactly the five
          # component/solvers.pins names, so a leg that vanished is a red job
          # here rather than a four-fifths release.
          pattern: nunchaku-*
          path: dl
          # Lets a re-run of this job alone reach the artifacts the build legs
          # uploaded in the previous attempt; without it the download 404s and
          # the recovery path the release procedure prescribes does not exist.
          github-token: ${{ github.token }}

      - name: Assemble and assert the twenty-five release assets
        run: .github/scripts/release-attach.sh collect dl

      - name: Create the release, upload, assert the contract, publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-attach.sh publish

  benchmark:
    name: benchmark
    needs: run
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.1.x
          dune-cache: true
          allow-prerelease-opam: true

      - run: opam install -t . --deps-only

      - name: Install CVC4 1.6
        run: |
          wget http://cvc4.cs.stanford.edu/downloads/builds/x86_64-linux-opt/cvc4-1.6-x86_64-linux-opt
          chmod +x cvc4-1.6-x86_64-linux-opt
          sudo mv cvc4-1.6-x86_64-linux-opt /usr/local/bin/cvc4

      - name: Install benchexec
        run: |
          sudo add-apt-repository -y ppa:sosy-lab/benchmarking
          sudo apt-get install -y benchexec

      - name: Build
        run: opam exec -- dune build @install --profile=release

      - name: Run benchmark
        run: |
          opam exec -- make bench
          cd bench/benchexec
          table-generator results/config.*.results.cvc4.xml.bz2 || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench/benchexec/results/
          retention-days: 30

      - name: Check benchmark results
        run: |
          cd bench/benchexec
          python3 check_results.py results/config.*.results.cvc4.csv || true

name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  run:
    name: build  # build+test on various versions of OCaml, on linux
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        ocaml-compiler:
          - 4.14.x
          - 5.0.x
          - 5.4.x

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true

      - run: opam install -t . --deps-only
      - run: opam exec -- dune build @install --profile=release
      - run: opam exec -- dune runtest --profile=release

  release-binary:
    name: static release binary (musl) + CLI smoke
    needs: run   # never attach a release asset from a tree whose test matrix is red
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: write   # for the tag-push GitHub release below
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.4.14.2+options,ocaml-option-musl,ocaml-option-static
          # no dune cache here: a release binary must never be able to come
          # out of a cache shared with the glibc build-matrix jobs
          dune-cache: false

      - run: opam install -t . --deps-only

      - name: Build (version from VERSION, static, tested, stripped)
        run: |
          # version comes from the VERSION file, not from git: dune subst
          # depends on git describe, which sees no annotated tag in a CI
          # checkout (lightweight tags only) and stamps a commit hash.
          # %{version:nunchaku} reads the opam file's version field
          # (measured: it wins over a dune-project (version) stanza).
          sed -i "s/^version: .*/version: \"$(cat VERSION)\"/" nunchaku.opam
          # ocaml-option-static alone leaves the final link dynamic (measured:
          # a musl PIE with interpreter /lib/ld-musl-x86_64.so.1); OCAMLPARAM
          # injects -static into ocamlopt's C-linker invocation.
          opam exec -- env OCAMLPARAM="_,ccopt=-static" dune build @install --profile=release
          opam exec -- env OCAMLPARAM="_,ccopt=-static" dune runtest --profile=release
          cp _build/default/src/main/nunchaku.exe nunchaku-bin
          strip nunchaku-bin

      - name: Fetch cvc5 (pinned release)
        run: |
          curl -sSL -o cvc5.zip https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.4/cvc5-Linux-x86_64-static.zip
          echo "dcdbfada0ce493ee98259c0816e0daafc561c223aadb3af298c2968e73ea39c6  cvc5.zip" | sha256sum -c
          unzip -q cvc5.zip

      - name: CLI smoke
        run: |
          set -o pipefail
          # really static?  INTERP is an ELF program-header name -- locale-
          # and wording-independent, unlike ldd's message
          file ./nunchaku-bin
          ! readelf -l ./nunchaku-bin | grep -q INTERP
          # the binary must self-report the release version (the single
          # source: the VERSION file)
          ./nunchaku-bin --version
          ./nunchaku-bin --version | grep -q " $(cat VERSION) "
          # the exact flag table the Isabelle frontend sends must parse, and the
          # answer must keep the SAT / {backend:...} output shape
          export NUNCHAKU_CVC5=$PWD/cvc5-Linux-x86_64-static/bin/cvc5
          ./nunchaku-bin --skolems-in-model --no-color --no-specialize \
            --solvers "cvc5,kodkod,paradox,smbc" --timeout 30 \
            --kodkod-min-bound 4 --kodkod-max-bound 8 --kodkod-bound-increment 4 \
            regress/gold.nun | tee smoke.out
          grep -q '^SAT' smoke.out
          grep -q '{backend:' smoke.out

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: nunchaku-bin-x86_64-linux
          path: nunchaku-bin
          retention-days: 90

      - name: Attach binary to the GitHub release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the tag must agree with the VERSION single source
          test "refs/tags/v$(cat VERSION)" = "${{ github.ref }}" || {
            echo "tag ${{ github.ref }} does not match VERSION $(cat VERSION)"; exit 1; }
          cp nunchaku-bin nunchaku-bin-x86_64-linux
          sha256sum nunchaku-bin-x86_64-linux > nunchaku-bin-x86_64-linux.sha256
          gh release create "${{ github.ref_name }}" --notes "See PATCHES.md for the patch set." || true
          gh release upload "${{ github.ref_name }}" nunchaku-bin-x86_64-linux nunchaku-bin-x86_64-linux.sha256 --clobber

  benchmark:
    name: benchmark
    needs: run
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.1.x
          dune-cache: true
          allow-prerelease-opam: true

      - run: opam install -t . --deps-only

      - name: Install CVC4 1.6
        run: |
          wget http://cvc4.cs.stanford.edu/downloads/builds/x86_64-linux-opt/cvc4-1.6-x86_64-linux-opt
          chmod +x cvc4-1.6-x86_64-linux-opt
          sudo mv cvc4-1.6-x86_64-linux-opt /usr/local/bin/cvc4

      - name: Install benchexec
        run: |
          sudo add-apt-repository -y ppa:sosy-lab/benchmarking
          sudo apt-get install -y benchexec

      - name: Build
        run: opam exec -- dune build @install --profile=release

      - name: Run benchmark
        run: |
          opam exec -- make bench
          cd bench/benchexec
          table-generator results/config.*.results.cvc4.xml.bz2 || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench/benchexec/results/
          retention-days: 30

      - name: Check benchmark results
        run: |
          cd bench/benchexec
          python3 check_results.py results/config.*.results.cvc4.csv || true

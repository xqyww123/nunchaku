name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run:
    name: build  # build+test on various versions of OCaml, on linux
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        container:
          - ghcr.io/c-cube/c-cube-commmon/ci-4.14:latest
          - ghcr.io/c-cube/c-cube-commmon/ci-5.0:latest
          - ghcr.io/c-cube/c-cube-commmon/ci-5.4:latest

    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4

      - run: opam install -t . --deps-only
      - run: opam exec -- dune build @install --profile=release
      - run: opam exec -- dune runtest --profile=release

  benchmark:
    name: benchmark
    needs: run
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container: ghcr.io/c-cube/c-cube-commmon/ci-5.4:latest
    steps:
      - uses: actions/checkout@v4

      - run: opam install -t . --deps-only

      - name: Install CVC4 1.6
        run: |
          apt-get update -qq
          apt-get install -y -qq wget
          wget http://cvc4.cs.stanford.edu/downloads/builds/x86_64-linux-opt/cvc4-1.6-x86_64-linux-opt
          chmod +x cvc4-1.6-x86_64-linux-opt
          mv cvc4-1.6-x86_64-linux-opt /usr/local/bin/cvc4

      - name: Install benchexec
        run: |
          apt-get install -y -qq software-properties-common
          add-apt-repository -y ppa:sosy-lab/benchmarking
          apt-get install -y -qq benchexec

      - name: Build
        run: opam exec -- dune build @install --profile=release

      - name: Run benchmark
        run: |
          opam exec -- make bench
          cd bench/benchexec
          table-generator results/config.*.results.cvc4.xml.bz2 || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench/benchexec/results/
          retention-days: 30

      - name: Check benchmark results
        run: |
          cd bench/benchexec
          python3 check_results.py results/config.*.results.cvc4.csv || true
